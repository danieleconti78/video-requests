<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Machine</title><meta name="robots" content="noindex,nofollow">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1316;color:#e8eeee;font:16px/1.5 -apple-system,system-ui,sans-serif}
.c{max-width:420px;padding:24px;text-align:center}.m{color:#8a9a9a;font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#7ad9d3;margin-right:8px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.3}}</style></head>
<body><div class="c"><h1 style="font-size:24px"><span class="dot"></span>CONTENT MACHINE</h1><p class="m" id="s">Connecting to the studio…</p></div>
<script>
(async()=>{const s=document.getElementById('s');try{const r=await fetch('url.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();
 const ok=await fetch(d.url+'/submit',{method:'HEAD',mode:'no-cors'}).then(()=>true).catch(()=>false);
 if(!ok)throw 0; location.replace(d.url+'/submit');
}catch(e){s.textContent='The studio is offline right now. Try again in a few minutes.'}})();
</script></body></html>
